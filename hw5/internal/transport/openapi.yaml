openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
  description: In-memory backend service for managing orders and their status history.
servers:
  - url: /
paths:
  /health:
    get:
      operationId: health
      summary: Check service availability
      responses:
        "200":
          description: Service is available
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/orders:
    post:
      operationId: createOrder
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listOrders
      summary: List orders
      responses:
        "200":
          description: Orders, sorted by identifier
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/orders/{id}:
    get:
      operationId: getOrder
      summary: Get an order
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      summary: Change order status
      parameters:
        - $ref: "#/components/parameters/OrderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/Status"
      responses:
        "200":
          description: Status changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/orders/{id}/history:
    get:
      operationId: getOrderHistory
      summary: Get chronological status history
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Status history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusChange"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    OrderID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    CreateOrder:
      type: object
      required: [items]
      properties:
        customer:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Item"
    Item:
      type: object
      required: [name, quantity, price]
      properties:
        name:
          type: string
          minLength: 1
          example: Keyboard
        quantity:
          type: integer
          format: int64
          minimum: 1
          example: 2
        price:
          type: integer
          format: int64
          minimum: 1
          description: Price in minimal monetary units
          example: 500000
    Status:
      type: string
      enum: [new, processing, completed, cancelled]
      x-enum-varnames: [StatusNew, StatusProcessing, StatusCompleted, StatusCancelled]
    StatusChange:
      type: object
      required: [status, changed_at]
      properties:
        status:
          $ref: "#/components/schemas/Status"
        changed_at:
          type: string
          format: date-time
    Order:
      type: object
      required: [id, items, total_price, status, created_at, history]
      properties:
        id:
          type: integer
        customer:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        total_price:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/Status"
        created_at:
          type: string
          format: date-time
        history:
          type: array
          items:
            $ref: "#/components/schemas/StatusChange"
    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
  responses:
    BadRequest:
      description: Invalid JSON or input data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Order not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Status transition is not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected internal error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
